<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Music Player</title>
<style>
  /* ========== RESET & BASE ========== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0a1a;
    --bg-card: rgba(18, 18, 40, 0.85);
    --bg-glass: rgba(255, 255, 255, 0.04);
    --text-primary: #f0f0f5;
    --text-secondary: rgba(240, 240, 245, 0.55);
    --accent: #7c5cfc;
    --accent-glow: rgba(124, 92, 252, 0.35);
    --accent-secondary: #e94590;
    --gradient-accent: linear-gradient(135deg, #7c5cfc, #e94590);
    --border: rgba(255, 255, 255, 0.06);
    --radius: 16px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 600px at 20% 30%, rgba(124, 92, 252, 0.12), transparent),
      radial-gradient(ellipse 500px 500px at 80% 70%, rgba(233, 69, 144, 0.1), transparent),
      radial-gradient(ellipse 400px 400px at 50% 50%, rgba(60, 200, 220, 0.06), transparent);
    animation: bgShift 20s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes bgShift {
    0%   { transform: scale(1) translate(0, 0); }
    50%  { transform: scale(1.1) translate(-2%, 3%); }
    100% { transform: scale(1) translate(2%, -2%); }
  }

  /* ========== PLAYER SHELL — LANDSCAPE (desktop default) ========== */
  .player {
    position: relative;
    z-index: 1;
    width: 900px;
    max-width: 96vw;
    background: var(--bg-card);
    backdrop-filter: blur(40px) saturate(1.3);
    -webkit-backdrop-filter: blur(40px) saturate(1.3);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 32px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.03) inset;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: auto;
    gap: 0 36px;
  }

  /* ========== LEFT COLUMN — Album Art ========== */
  .player-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    grid-row: 1 / 2;
  }

  /* ========== RIGHT COLUMN — Controls & Info ========== */
  .player-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    grid-row: 1 / 2;
  }

  /* ========== BOTTOM FULL-WIDTH — Playlist ========== */
  .player-bottom {
    grid-column: 1 / -1;
  }

  /* ========== ALBUM ART ========== */
  .album-art-wrapper {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 18px 50px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05) inset;
    transition: transform var(--transition), box-shadow var(--transition);
    flex-shrink: 0;
  }

  .album-art-wrapper:hover {
    transform: scale(1.03);
    box-shadow:
      0 24px 60px rgba(0,0,0,0.55),
      0 0 30px var(--accent-glow);
  }

  .album-art-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }

  .player.playing .album-art-wrapper img {
    animation: artFloat 6s ease-in-out infinite;
  }

  @keyframes artFloat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* Album art fallback */
  .album-art-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
    font-size: 72px;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .album-art-fallback.visible { opacity: 1; }

  /* ========== VISUALIZER ========== */
  .visualizer-canvas {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    pointer-events: none;
    opacity: 0.7;
  }

  /* ========== SONG INFO ========== */
  .song-info {
    margin-bottom: 20px;
    min-height: 55px;
  }

  .song-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artist {
    font-size: 0.95rem;
    color: var(--text-secondary);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ========== PROGRESS ========== */
  .progress-section { margin-bottom: 22px; }

  .progress-bar-container {
    position: relative;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    cursor: pointer;
    transition: height var(--transition);
  }

  .progress-bar-container:hover { height: 10px; }

  .progress-bar-fill {
    height: 100%;
    background: var(--gradient-accent);
    border-radius: 3px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
    transition: transform var(--transition);
  }

  .progress-bar-container:hover .progress-bar-fill::after {
    transform: translateY(-50%) scale(1);
  }

  .time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ========== CONTROLS ========== */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 22px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    border-radius: 50%;
    opacity: 0.8;
  }

  .ctrl-btn:hover { opacity: 1; transform: scale(1.12); }
  .ctrl-btn:active { transform: scale(0.95); }

  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }

  .ctrl-btn.small svg { width: 18px; height: 18px; }
  .ctrl-btn.small { width: 36px; height: 36px; }

  .ctrl-btn.medium { width: 44px; height: 44px; }
  .ctrl-btn.medium svg { width: 24px; height: 24px; }

  /* Play / Pause main button */
  .play-pause-btn {
    width: 60px;
    height: 60px;
    background: var(--gradient-accent) !important;
    box-shadow: 0 6px 24px var(--accent-glow);
    opacity: 1 !important;
  }

  .play-pause-btn svg { width: 26px; height: 26px; }

  .play-pause-btn:hover {
    box-shadow: 0 8px 32px rgba(124, 92, 252, 0.5);
  }

  /* Active toggle indicators */
  .ctrl-btn.active { color: var(--accent); opacity: 1; }

  /* ========== VOLUME ========== */
  .volume-section {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }

  .volume-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: color var(--transition);
    flex-shrink: 0;
  }
  .volume-btn:hover { color: var(--text-primary); }
  .volume-btn svg { width: 20px; height: 20px; fill: currentColor; }

  .volume-slider-container {
    flex: 1;
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    cursor: pointer;
  }

  .volume-slider-fill {
    height: 100%;
    background: var(--gradient-accent);
    border-radius: 2px;
    width: 80%;
    position: relative;
  }

  .volume-slider-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .volume-slider-container:hover .volume-slider-fill::after { opacity: 1; }

  .volume-label {
    font-size: 0.7rem;
    color: var(--text-secondary);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* ========== PLAYLIST ========== */
  .playlist-toggle {
    width: 100%;
    padding: 10px;
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
  }

  .playlist-toggle:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
  }

  .playlist-toggle svg { width: 16px; height: 16px; fill: currentColor; transition: transform var(--transition); }
  .playlist-toggle.open svg { transform: rotate(180deg); }

  .playlist-container {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .playlist-container.open { max-height: 400px; }

  .playlist-list {
    list-style: none;
    margin-top: 12px;
    max-height: 240px;
    overflow-y: auto;
    border-radius: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .playlist-list::-webkit-scrollbar { width: 4px; }
  .playlist-list::-webkit-scrollbar-track { background: transparent; }
  .playlist-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .playlist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
  }

  .playlist-item:hover { background: rgba(255,255,255,0.05); }

  .playlist-item.active {
    background: rgba(124, 92, 252, 0.12);
  }

  .playlist-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 20%;
    height: 60%;
    width: 3px;
    background: var(--gradient-accent);
    border-radius: 2px;
  }

  .playlist-item-art {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
  }

  .playlist-item-info { flex: 1; min-width: 0; }

  .playlist-item-title {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-item-artist {
    font-size: 0.72rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-item-duration {
    font-size: 0.72rem;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Playing indicator animation */
  .playing-indicator {
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
  }
  .playlist-item.active .playing-indicator { display: flex; }
  .playlist-item.active .playlist-item-duration { display: none; }

  .playing-indicator span {
    display: block;
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: eqBar 1.2s ease-in-out infinite;
  }
  .playing-indicator span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .playing-indicator span:nth-child(2) { height: 10px; animation-delay: 0.2s; }
  .playing-indicator span:nth-child(3) { height: 4px; animation-delay: 0.4s; }

  @keyframes eqBar {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.4); }
  }

  /* ========== TOAST NOTIFICATION ========== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(30, 30, 60, 0.95);
    backdrop-filter: blur(20px);
    color: var(--text-primary);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ========== RESPONSIVE — TABLET (narrow landscape) ========== */
  @media (max-width: 860px) {
    .player {
      width: 96vw;
      grid-template-columns: 240px 1fr;
      gap: 0 24px;
      padding: 24px;
    }

    .album-art-wrapper {
      width: 220px;
      height: 220px;
    }

    .song-title { font-size: 1.25rem; }
  }

  /* ========== RESPONSIVE — MOBILE (portrait stack) ========== */
  @media (max-width: 600px) {
    body {
      align-items: flex-start;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 0;
      min-height: 100vh;
      width: 100vw;
      max-width: 100vw;
      padding: 40px 20px 28px;
      justify-content: center;
    }

    .player-left {
      width: 100%;
    }

    .player-right {
      width: 100%;
    }

    .player-bottom {
      width: 100%;
    }

    .album-art-wrapper {
      width: 240px;
      height: 240px;
      margin-bottom: 24px;
    }

    .song-info {
      text-align: center;
    }

    .song-title { font-size: 1.2rem; }
    .song-artist { font-size: 0.85rem; }

    .controls { gap: 12px; }
  }

  /* ========== FOCUS VISIBLE ========== */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="player" id="player">
  <!-- LEFT: Album Art -->
  <div class="player-left">
    <div class="album-art-wrapper">
      <img id="albumArt" src="" alt="Album Art">
      <div class="album-art-fallback visible" id="albumArtFallback">🎵</div>
      <canvas class="visualizer-canvas" id="visualizerCanvas"></canvas>
    </div>
  </div>

  <!-- RIGHT: Song Info + Controls -->
  <div class="player-right">
    <!-- Song Info -->
    <div class="song-info">
      <div class="song-title" id="songTitle">No Song Loaded</div>
      <div class="song-artist" id="songArtist">—</div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-bar-container" id="progressBar" role="slider" aria-label="Seek" tabindex="0">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Shuffle -->
      <button class="ctrl-btn small" id="shuffleBtn" title="Shuffle (S)" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <!-- Previous -->
      <button class="ctrl-btn medium" id="prevBtn" title="Previous (←)" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <!-- Play/Pause -->
      <button class="ctrl-btn play-pause-btn" id="playPauseBtn" title="Play/Pause (Space)" aria-label="Play">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <!-- Next -->
      <button class="ctrl-btn medium" id="nextBtn" title="Next (→)" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <!-- Repeat -->
      <button class="ctrl-btn small" id="repeatBtn" title="Repeat (R)" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-section">
      <button class="volume-btn" id="muteBtn" title="Mute (M)" aria-label="Mute">
        <svg viewBox="0 0 24 24" id="volumeIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <div class="volume-slider-container" id="volumeSlider" role="slider" aria-label="Volume" tabindex="0">
        <div class="volume-slider-fill" id="volumeFill"></div>
      </div>
      <span class="volume-label" id="volumeLabel">80%</span>
    </div>
  </div>

  <!-- BOTTOM: Playlist (spans full width) -->
  <div class="player-bottom">
    <!-- Playlist Toggle -->
    <button class="playlist-toggle" id="playlistToggle">
      <span>Playlist</span>
      <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>

    <!-- Playlist -->
    <div class="playlist-container" id="playlistContainer">
      <ul class="playlist-list" id="playlistList"></ul>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  // PLAYLIST DATA
  // Modify this array to change the songs in the player.
  // Each song needs: title, artist, src (audio URL), art (image URL)
  // ============================================================
  const PLAYLIST = [
    {
      title: 'Ambient Flow',
      artist: 'SoundHelix',
      src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
      art: 'https://picsum.photos/seed/song1/300/300'
    },
    {
      title: 'Electric Dreams',

      art: 'https://picsum.photos/seed/song2/300/300'
    },
    {
      title: 'Midnight Jazz',
      artist: 'SoundHelix',
      src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
      art: 'https://picsum.photos/seed/song3/300/300'
    },
    {
      title: 'Urban Groove',
      artist: 'SoundHelix',
      src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3',
      art: 'https://picsum.photos/seed/song4/300/300'
    },
    {
      title: 'Sunset Vibes',
      artist: 'SoundHelix',
      src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3',
      art: 'https://picsum.photos/seed/song5/300/300'
    }
  ];

  // ============================================================
  // DOM ELEMENTS
  // ============================================================
  const $ = id => document.getElementById(id);
  const player        = $('player');
  const audio         = new Audio();
  const albumArt      = $('albumArt');
  const albumFallback = $('albumArtFallback');
  const songTitle     = $('songTitle');
  const songArtist    = $('songArtist');
  const progressBar   = $('progressBar');
  const progressFill  = $('progressFill');
  const currentTimeEl = $('currentTime');
  const totalTimeEl   = $('totalTime');
  const playPauseBtn  = $('playPauseBtn');
  const playIcon      = $('playIcon');
  const prevBtn       = $('prevBtn');
  const nextBtn       = $('nextBtn');
  const shuffleBtn    = $('shuffleBtn');
  const repeatBtn     = $('repeatBtn');
  const muteBtn       = $('muteBtn');
  const volumeIcon    = $('volumeIcon');
  const volumeSlider  = $('volumeSlider');
  const volumeFill    = $('volumeFill');
  const volumeLabel   = $('volumeLabel');
  const playlistToggle = $('playlistToggle');
  const playlistContainer = $('playlistContainer');
  const playlistList  = $('playlistList');
  const canvas        = $('visualizerCanvas');
  const toast         = $('toast');

  // ============================================================
  // STATE
  // ============================================================
  let currentIndex = 0;
  let isPlaying    = false;
  let isShuffle    = false;
  let repeatMode   = 0;  // 0 = off, 1 = all, 2 = one
  let volume       = 0.8;
  let prevVolume   = 0.8;
  let isMuted      = false;
  let audioCtx, analyser, source, dataArray, animFrameId;
  let visualizerInitialized = false;

  // ============================================================
  // ICONS (SVG paths)
  // ============================================================
  const ICONS = {
    play:       '<path d="M8 5v14l11-7z"/>',
    pause:      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
    volHigh:    '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>',
    volLow:     '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>',
    volMute:    '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>',
    repeatAll:  '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
    repeatOne:  '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="16" text-anchor="middle" font-size="7" font-weight="bold" fill="currentColor">1</text>',
  };

  // ============================================================
  // UTILITIES
  // ============================================================
  function formatTime(sec) {
    if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function showToast(msg, duration = 2000) {
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('visible'), duration);
  }

  // ============================================================
  // PLAYLIST RENDERING
  // ============================================================
  function renderPlaylist() {
    playlistList.innerHTML = '';
    PLAYLIST.forEach((song, i) => {
      const li = document.createElement('li');
      li.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
      li.setAttribute('role', 'option');
      li.setAttribute('tabindex', '0');
      li.innerHTML = `
        <img class="playlist-item-art" src="${song.art}" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <div class="playlist-item-info">
          <div class="playlist-item-title">${song.title}</div>
          <div class="playlist-item-artist">${song.artist}</div>
        </div>
        <span class="playlist-item-duration"></span>
        <div class="playing-indicator">
          <span></span><span></span><span></span>
        </div>
      `;
      li.addEventListener('click', () => loadSong(i, true));
      li.addEventListener('keydown', e => { if (e.key === 'Enter') loadSong(i, true); });
      playlistList.appendChild(li);
    });
  }

  // ============================================================
  // LOAD SONG
  // ============================================================
  function loadSong(index, autoplay = false) {
    if (index < 0 || index >= PLAYLIST.length) return;
    currentIndex = index;
    const song = PLAYLIST[currentIndex];

    // Update audio
    audio.src = song.src;
    audio.load();

    // Update UI
    songTitle.textContent  = song.title;
    songArtist.textContent = song.artist;
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
    totalTimeEl.textContent   = '0:00';

    // Album art with fallback
    albumArt.src = song.art;
    albumArt.onload = () => albumFallback.classList.remove('visible');
    albumArt.onerror = () => albumFallback.classList.add('visible');

    // Update playlist highlight
    renderPlaylist();

    if (autoplay) playSong();
  }

  // ============================================================
  // PLAY / PAUSE
  // ============================================================
  function playSong() {
    audio.play().then(() => {
      isPlaying = true;
      player.classList.add('playing');
      playIcon.innerHTML = ICONS.pause;
      playPauseBtn.setAttribute('aria-label', 'Pause');
      initVisualizer();
    }).catch(err => {
      console.warn('Playback error:', err);
      showToast('Unable to play this track');
    });
  }

  function pauseSong() {
    audio.pause();
    isPlaying = false;
    player.classList.remove('playing');
    playIcon.innerHTML = ICONS.play;
    playPauseBtn.setAttribute('aria-label', 'Play');
  }

  function togglePlayPause() {
    if (PLAYLIST.length === 0) return;
    if (!audio.src || audio.src === window.location.href) loadSong(0, true);
    else isPlaying ? pauseSong() : playSong();
  }

  // ============================================================
  // NEXT / PREV
  // ============================================================
  function nextSong() {
    let next;
    if (isShuffle) {
      do { next = Math.floor(Math.random() * PLAYLIST.length); }
      while (next === currentIndex && PLAYLIST.length > 1);
    } else {
      next = (currentIndex + 1) % PLAYLIST.length;
    }
    loadSong(next, isPlaying);
  }

  function prevSong() {
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    const prev = (currentIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
    loadSong(prev, isPlaying);
  }

  // ============================================================
  // SHUFFLE & REPEAT
  // ============================================================
  function toggleShuffle() {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
    showToast(isShuffle ? 'Shuffle On' : 'Shuffle Off');
  }

  function cycleRepeat() {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('active', repeatMode !== 0);
    if (repeatMode === 2) {
      repeatBtn.querySelector('svg').innerHTML = ICONS.repeatOne;
    } else {
      repeatBtn.querySelector('svg').innerHTML = ICONS.repeatAll;
    }
    const labels = ['Repeat Off', 'Repeat All', 'Repeat One'];
    showToast(labels[repeatMode]);
  }

  // ============================================================
  // AUDIO EVENTS
  // ============================================================
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      playSong();
    } else if (repeatMode === 1 || (currentIndex < PLAYLIST.length - 1)) {
      nextSong();
    } else {
      pauseSong();
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
    }
  });

  audio.addEventListener('error', () => {
    showToast('Error loading audio file');
    console.error('Audio error for:', PLAYLIST[currentIndex]?.title);
  });

  // ============================================================
  // PROGRESS BAR SEEKING
  // ============================================================
  function seekFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration) {
      audio.currentTime = pct * audio.duration;
      progressFill.style.width = (pct * 100) + '%';
    }
  }

  let isSeeking = false;
  progressBar.addEventListener('mousedown', e => { isSeeking = true; seekFromEvent(e); });
  document.addEventListener('mousemove', e => { if (isSeeking) seekFromEvent(e); });
  document.addEventListener('mouseup', () => { isSeeking = false; });

  // Touch support
  progressBar.addEventListener('touchstart', e => { isSeeking = true; seekFromEvent(e.touches[0]); }, { passive: true });
  document.addEventListener('touchmove', e => { if (isSeeking) seekFromEvent(e.touches[0]); }, { passive: true });
  document.addEventListener('touchend', () => { isSeeking = false; });

  // Keyboard on progress bar
  progressBar.addEventListener('keydown', e => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    if (e.key === 'ArrowLeft')  audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  // ============================================================
  // VOLUME CONTROL
  // ============================================================
  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    audio.volume = volume;
    isMuted = volume === 0;
    volumeFill.style.width = (volume * 100) + '%';
    volumeLabel.textContent = Math.round(volume * 100) + '%';
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    if (isMuted || volume === 0) {
      volumeIcon.innerHTML = ICONS.volMute;
    } else if (volume < 0.5) {
      volumeIcon.innerHTML = ICONS.volLow;
    } else {
      volumeIcon.innerHTML = ICONS.volHigh;
    }
  }

  function toggleMute() {
    if (isMuted) {
      isMuted = false;
      setVolume(prevVolume || 0.5);
    } else {
      prevVolume = volume;
      isMuted = true;
      audio.volume = 0;
      volumeFill.style.width = '0%';
      volumeLabel.textContent = '0%';
      updateVolumeIcon();
    }
  }

  function volumeFromEvent(e) {
    const rect = volumeSlider.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setVolume(pct);
  }

  let isVolumeAdjusting = false;
  volumeSlider.addEventListener('mousedown', e => { isVolumeAdjusting = true; volumeFromEvent(e); });
  document.addEventListener('mousemove', e => { if (isVolumeAdjusting) volumeFromEvent(e); });
  document.addEventListener('mouseup', () => { isVolumeAdjusting = false; });

  volumeSlider.addEventListener('touchstart', e => { isVolumeAdjusting = true; volumeFromEvent(e.touches[0]); }, { passive: true });
  document.addEventListener('touchmove', e => { if (isVolumeAdjusting) volumeFromEvent(e.touches[0]); }, { passive: true });
  document.addEventListener('touchend', () => { isVolumeAdjusting = false; });

  volumeSlider.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   setVolume(volume + 0.05);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') setVolume(volume - 0.05);
  });

  // ============================================================
  // BUTTON EVENTS
  // ============================================================
  playPauseBtn.addEventListener('click', togglePlayPause);
  nextBtn.addEventListener('click', nextSong);
  prevBtn.addEventListener('click', prevSong);
  shuffleBtn.addEventListener('click', toggleShuffle);
  repeatBtn.addEventListener('click', cycleRepeat);
  muteBtn.addEventListener('click', toggleMute);

  playlistToggle.addEventListener('click', () => {
    playlistContainer.classList.toggle('open');
    playlistToggle.classList.toggle('open');
  });

  // ============================================================
  // KEYBOARD SHORTCUTS
  // ============================================================
  document.addEventListener('keydown', e => {
    // Don't capture when typing in inputs
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case ' ':
        e.preventDefault();
        togglePlayPause();
        break;
      case 'ArrowRight':
        if (document.activeElement !== progressBar && document.activeElement !== volumeSlider) {
          e.preventDefault();
          nextSong();
        }
        break;
      case 'ArrowLeft':
        if (document.activeElement !== progressBar && document.activeElement !== volumeSlider) {
          e.preventDefault();
          prevSong();
        }
        break;
      case 'ArrowUp':
        if (document.activeElement !== volumeSlider) {
          e.preventDefault();
          setVolume(volume + 0.05);
        }
        break;
      case 'ArrowDown':
        if (document.activeElement !== volumeSlider) {
          e.preventDefault();
          setVolume(volume - 0.05);
        }
        break;
      case 'm':
      case 'M':
        toggleMute();
        break;
      case 's':
      case 'S':
        toggleShuffle();
        break;
      case 'r':
      case 'R':
        cycleRepeat();
        break;
    }
  });

  // ============================================================
  // AUDIO VISUALIZER
  // ============================================================
  function initVisualizer() {
    if (visualizerInitialized) return;
    try {
      audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
      analyser  = audioCtx.createAnalyser();
      source    = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 128;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      visualizerInitialized = true;
      drawVisualizer();
    } catch (err) {
      console.warn('Visualizer not available:', err);
    }
  }

  function drawVisualizer() {
    if (!analyser) return;
    animFrameId = requestAnimationFrame(drawVisualizer);

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.scale(dpr, dpr);

    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    ctx.clearRect(0, 0, W, H);

    analyser.getByteFrequencyData(dataArray);

    const barCount = 32;
    const gap = 2;
    const barW = (W - gap * (barCount - 1)) / barCount;

    for (let i = 0; i < barCount; i++) {
      const val = dataArray[i] / 255;
      const barH = val * H * 0.9;
      const x = i * (barW + gap);
      const y = H - barH;

      const grad = ctx.createLinearGradient(x, H, x, y);
      grad.addColorStop(0, 'rgba(124, 92, 252, 0.6)');
      grad.addColorStop(1, 'rgba(233, 69, 144, 0.4)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, barW, barH, 2);
      ctx.fill();
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  setVolume(0.8);
  renderPlaylist();
  if (PLAYLIST.length > 0) loadSong(0, false);

})();
</script>
</body>
</html>
